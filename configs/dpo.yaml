# Direct Preference Optimization Configuration
# Preference alignment stage


stage: dpo_alignment


model:
  base_model: runs/sft_merged
  task: causal_language_modeling


data:
  type: preference_dataset

  format:
    prompt: prompt
    chosen: chosen
    rejected: rejected


training:
  objective: dpo

  batch_size: 1

  epochs: 3
  max_steps: 100

  learning_rate: 5e-4

  logging_steps: 10
  eval_steps: 25
  save_steps: 50

  gradient_checkpointing: true


dpo:
  beta: null


lora:
  enabled: true
  type: LORA

  rank: 8
  alpha: 16
  dropout: 0.05


output:
  save_adapter_only: true
