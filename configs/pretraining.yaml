# Continued Pretraining Configuration
# Medical domain adaptation with LoRA

# MedicalGPT Continued Pretraining Configuration

stage: continued_pretraining


model:
  name: Qwen3.5-0.8B
  task: causal_language_modeling


data:
  type: medical_corpus
  block_size: 512
  packing: true


training:
  objective: causal_lm

  batch_size: 2

  epochs: 3
  max_steps: 100

  logging_steps: 10
  eval_steps: 25
  save_steps: 50

  gradient_checkpointing: true


lora:
  enabled: true
  type: LORA

  rank: 8
  alpha: 16
  dropout: 0.05


output:
  save_adapter_only: true
